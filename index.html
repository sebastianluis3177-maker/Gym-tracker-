      .wrap{ max-width:640px; margin:0 auto; padding:0 16px; }

      /* ---------- header / HUD ---------- */
      .hud{
        position:sticky; top:0; z-index:30; background:rgba(11,14,17,.92);
        backdrop-filter:blur(8px); border-bottom:1px solid var(--line);
        padding:calc(10px + env(safe-area-inset-top)) 0 10px;
      }
      .hud-row{ display:flex; align-items:center; gap:12px; }
      .avatar{
        width:44px; height:44px; border-radius:50%; flex:none;
        background:var(--volt); color:var(--volt-ink);
        display:flex; align-items:center; justify-content:center;
        font-family:"Barlow Condensed",sans-serif; font-weight:700; font-size:22px;
      }
      .hud-name{ font-weight:700; font-size:17px; line-height:1.1; }
      .hud-sub{ color:var(--muted); font-size:12.5px; }
      .hud-right{ margin-left:auto; display:flex; align-items:center; gap:8px; }
      .pill{
        display:inline-flex; align-items:center; gap:5px;
        background:var(--panel2); border:1px solid var(--line);
        border-radius:999px; padding:5px 11px; font-weight:700; font-size:13.5px;
      }
      .pill svg{ width:15px; height:15px; }
      .pill.streak{ color:var(--orange); border-color:#4a2f1a; }
      .pill.level{ color:var(--volt); border-color:#33450f; }
      .xpbar{ height:8px; background:var(--panel2); border-radius:99px; overflow:hidden; margin-top:10px; }
      .xpbar > div{ height:100%; background:var(--volt); border-radius:99px; transition:width .5s ease; }
      .xp-meta{ display:flex; justify-content:space-between; font-size:12px; color:var(--muted); margin-top:5px; }

      /* ---------- quest banner ---------- */
      .quest-banner{
        margin-top:16px; border:1px solid #33450f; border-radius:var(--radius);
        background:var(--panel); padding:18px;
      }
      .quest-banner .tag{
        display:inline-block; background:var(--volt); color:var(--volt-ink);
        font-family:"Barlow Condensed",sans-serif; font-weight:700; letter-spacing:.08em;
        font-size:13px; padding:3px 10px; border-radius:6px; text-transform:uppercase;
      }
      .quest-banner h1{ font-size:34px; line-height:1.02; margin-top:10px; }
      .quest-banner .sub{ color:var(--muted); margin-top:6px; font-size:15px; }
      .quest-banner.done{ border-color:var(--line); }
      .quest-banner.rest{ border-color:var(--line); }
      .quest-banner.rest .tag{ background:var(--panel2); color:var(--muted); }

      /* ---------- week strip ---------- */
      .week{ display:grid; grid-template-columns:repeat(7,1fr); gap:6px; margin-top:14px; }
      .day-dot{
        background:var(--panel); border:1px solid var(--line); border-radius:10px;
        padding:8px 2px 7px; text-align:center; color:var(--muted);
        font-size:11.5px; font-weight:600; line-height:1.25; min-height:52px;
      }
      .day-dot .d{ display:block; font-size:15px; color:var(--ink); font-weight:700; }
      .day-dot.sel{ border-color:var(--volt); }
      .day-dot.done .st{ color:var(--volt); }
      .day-dot.missed .st{ color:var(--red); }
      .day-dot .st{ font-size:11px; font-weight:700; letter-spacing:.03em; }

      /* ---------- exercise cards ---------- */
      .ex-card{
        background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
        padding:14px; margin-top:12px;
      }
      .ex-card.complete{ border-color:#33450f; }
      .ex-head{ display:flex; align-items:flex-start; gap:10px; }
      .ex-name{ font-size:21px; line-height:1.05; }
      .ex-target{ color:var(--muted); font-size:13.5px; margin-top:2px; }
      .ex-xp{ margin-left:auto; flex:none; color:var(--volt); font-weight:700; font-size:13px; text-align:right; }
      .tip-btn{
        background:none; border:1px solid var(--line); color:var(--muted);
        border-radius:8px; padding:4px 9px; font-size:12.5px; font-weight:600; margin-top:8px;
      }
      .tip-box{
        display:none; margin-top:8px; background:var(--panel2); border-radius:10px;
        padding:10px 12px; font-size:14px; color:var(--ink);
      }
      .tip-box.open{ display:block; }
      .set-row{
        display:flex; align-items:center; gap:10px; margin-top:10px;
        background:var(--panel2); border:1px solid var(--line); border-radius:12px; padding:8px;
      }
      .set-check{
        width:52px; height:52px; flex:none; border-radius:12px;
        border:2px solid var(--faint); background:transparent; color:transparent;
        display:flex; align-items:center; justify-content:center; padding:0;
      }
      .set-check svg{ width:26px; height:26px; }
      .set-check.on{ background:var(--volt); border-color:var(--volt); color:var(--volt-ink); }
      .set-num{ font-family:"Barlow Condensed",sans-serif; font-weight:700; font-size:14px; color:var(--muted); width:34px; flex:none; text-transform:uppercase; }
      .set-fields{ display:flex; gap:8px; flex:1; }
      .field{ flex:1; }
      .field label{ display:block; font-size:10.5px; font-weight:700; letter-spacing:.07em; color:var(--faint); text-transform:uppercase; margin-bottom:2px; }
      .field input{
        width:100%; background:var(--bg); border:1px solid var(--line); color:var(--ink);
        border-radius:9px; padding:9px 8px; font-size:16px; font-weight:600; text-align:center;
      }
      .ex-foot{ display:flex; gap:8px; align-items:center; margin-top:12px; flex-wrap:wrap; }
      .ex-foot .lbl{ font-size:12px; font-weight:700; letter-spacing:.06em; color:var(--faint); text-transform:uppercase; }
      .effort-sel{
        background:var(--bg); border:1px solid var(--line); color:var(--ink);
        border-radius:9px; padding:9px; font-size:15px; font-weight:600;
      }
      .pain-btn{
        border:1px solid var(--line); background:var(--panel2); color:var(--muted);
        border-radius:9px; padding:9px 12px; font-weight:700; font-size:13.5px;
      }
      .pain-btn.on{ background:#3a1d1d; border-color:var(--red); color:var(--red); }
      .pr-tag{
        display:inline-block; background:var(--gold); color:#241a02; font-weight:700;
        font-size:12px; padding:2px 8px; border-radius:6px; margin-left:8px; vertical-align:middle;
      }

      /* ---------- generic cards / buttons ---------- */
      .card{ background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:16px; margin-top:14px; }
      .card h2{ font-size:23px; }
      .card h3{ font-size:18px; }
      .muted{ color:var(--muted); }
      .small{ font-size:13.5px; }
      .btn{
        display:inline-flex; align-items:center; justify-content:center; gap:8px;
        background:var(--volt); color:var(--volt-ink); border:none; border-radius:12px;
        padding:14px 18px; font-weight:700; font-size:16px; min-height:52px; width:100%;
      }
      .btn.secondary{ background:var(--panel2); color:var(--ink); border:1px solid var(--line); }
      .btn.danger{ background:#3a1d1d; color:var(--red); border:1px solid var(--red); }
      .btn:disabled{ opacity:.45; }
      .btn-row{ display:flex; gap:10px; margin-top:12px; }
      .btn-row .btn{ flex:1; }
      .form-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:12px; }
      .form-grid .full{ grid-column:1 / -1; }
      .text-in{
        width:100%; background:var(--bg); border:1px solid var(--line); color:var(--ink);
        border-radius:10px; padding:12px; font-size:16px;
      }
      label.flabel{ display:block; font-size:12px; font-weight:700; letter-spacing:.06em; color:var(--faint); text-transform:uppercase; margin-bottom:5px; }
      .sched-row{ display:flex; align-items:center; gap:10px; margin-top:8px; }
      .sched-day{ width:96px; flex:none; font-weight:700; font-size:15px; }
      .sched-sel{ flex:1; }
      .checkin-big{
        width:100%; min-height:76px; border-radius:14px; border:2px dashed var(--faint);
        background:var(--panel2); color:var(--ink); font-size:19px; font-weight:700;
        font-family:"Barlow Condensed",sans-serif; letter-spacing:.05em; text-transform:uppercase;
      }
      .checkin-big.on{ border-style:solid; border-color:var(--volt); background:#1b2608; color:var(--volt); }

      /* ---------- sections / lists ---------- */
      .sect-title{ font-size:26px; margin-top:22px; }
      .stat-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:12px; }
      .stat{ background:var(--panel2); border:1px solid var(--line); border-radius:12px; padding:11px 8px; text-align:center; }
      .stat .v{ font-family:"Barlow Condensed",sans-serif; font-size:24px; font-weight:700; line-height:1; }
      .stat .k{ font-size:11px; color:var(--muted); font-weight:700; letter-spacing:.05em; text-transform:uppercase; margin-top:4px; }
      .score-num{ font-family:"Barlow Condensed",sans-serif; font-size:64px; font-weight:700; color:var(--volt); line-height:.95; }
      .score-bar{ height:10px; background:var(--panel2); border-radius:99px; overflow:hidden; margin-top:6px; }
      .score-bar > div{ height:100%; background:var(--volt); }
      .score-row{ margin-top:13px; }
      .score-row .r-head{ display:flex; justify-content:space-between; font-size:14px; font-weight:600; }
      .score-row .r-head span:last-child{ color:var(--muted); }
      .pr-chip{ display:inline-block; background:var(--volt); color:var(--volt-ink); font-weight:700; font-size:13.5px; padding:4px 12px; border-radius:999px; }
      .pr-link{ background:none; border:none; color:var(--volt); font-weight:700; font-size:14.5px; padding:0; text-align:left; }
      table.hist{ width:100%; border-collapse:collapse; margin-top:10px; font-size:14.5px; }
      table.hist th{ text-align:left; color:var(--faint); font-size:11.5px; letter-spacing:.06em; text-transform:uppercase; padding:6px 6px 6px 0; border-bottom:1px solid var(--line); }
      table.hist td{ padding:8px 6px 8px 0; border-bottom:1px solid var(--line); }
      .coach-card{ border-radius:var(--radius); padding:14px 16px; margin-top:10px; border:1px solid var(--line); background:var(--panel); }
      .coach-card h3{ font-size:19px; margin-bottom:4px; }
      .coach-card.good{ border-color:#33450f; }
      .coach-card.warn{ border-color:#5a3a14; }
      .coach-card.bad{ border-color:#5c2323; }
      .coach-card .who{ font-size:11.5px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--faint); margin-bottom:3px; }
      .chat-row{ display:flex; gap:10px; margin-top:10px; align-items:flex-start; }
      .chat-av{
        width:34px; height:34px; border-radius:50%; flex:none; background:var(--volt); color:var(--volt-ink);
        font-family:"Barlow Condensed",sans-serif; font-weight:700; font-size:14px;
        display:flex; align-items:center; justify-content:center;
      }
      .bubble{ background:var(--panel2); border:1px solid var(--line); border-radius:4px 14px 14px 14px; padding:11px 13px; font-size:15px; flex:1; }
      .bubble b{ color:var(--volt); }
      .tag-chip{
        display:inline-flex; align-items:center; gap:6px; background:var(--panel2); border:1px solid var(--line);
        color:var(--muted); border-radius:999px; padding:7px 12px; font-weight:700; font-size:13.5px; margin:0 6px 6px 0;
      }
      .tag-chip.on{ background:#1b2608; border-color:#3c5a12; color:var(--volt); }
      .tag-chip button{ background:none; border:none; color:inherit; font-size:16px; padding:0; line-height:1; }
      .meal-row{ display:flex; gap:12px; padding:11px 0; border-top:1px solid var(--line); align-items:flex-start; }
      .meal-thumb{ width:64px; height:64px; flex:none; object-fit:cover; border-radius:10px; border:1px solid var(--line); background:var(--panel2); }
      .badge-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:9px; margin-top:12px; }
      .badge{
        background:var(--panel); border:1px solid var(--line); border-radius:12px;
        padding:12px 8px; text-align:center;
      }
      .badge svg{ width:30px; height:30px; color:var(--faint); }
      .badge .bn{ font-weight:700; font-size:13px; margin-top:6px; line-height:1.2; }
      .badge .bd{ font-size:11.5px; color:var(--muted); margin-top:3px; line-height:1.3; }
      .badge.unlocked{ border-color:#33450f; }
      .badge.unlocked svg{ color:var(--gold); }
      .badge.locked{ opacity:.55; }
      .photo-grid{ display:grid; grid-template-columns:1fr 1fr; gap:9px; margin-top:12px; }
      .photo-cell{ position:relative; border-radius:12px; overflow:hidden; border:1px solid var(--line); background:var(--panel2); }
      .photo-cell img{ width:100%; height:170px; object-fit:cover; display:block; }
      .photo-cell .pd{ position:absolute; left:0; right:0; bottom:0; background:rgba(5,7,5,.75); color:#fff; font-size:12px; font-weight:600; padding:5px 9px; }
      .photo-cell .del{
        position:absolute; top:6px; right:6px; width:30px; height:30px; border-radius:50%;
        border:none; background:rgba(5,7,5,.75); color:#fff; font-size:15px; line-height:1;
      }
      .compare{ display:grid; grid-template-columns:1fr 1fr; gap:9px; margin-top:10px; }
      .compare figure{ margin:0; }
      .compare img{ width:100%; height:210px; object-fit:cover; border-radius:12px; border:1px solid var(--line); display:block; background:var(--panel2); }
      .compare figcaption{ font-size:12.5px; color:var(--muted); font-weight:600; margin-top:5px; text-align:center; }
      .steps{ counter-reset:step; margin:12px 0 0; padding:0; list-style:none; }
      .steps li{ position:relative; padding:0 0 14px 40px; font-size:15px; }
      .steps li::before{
        counter-increment:step; content:counter(step);
        position:absolute; left:0; top:-2px; width:27px; height:27px; border-radius:50%;
        background:var(--volt); color:var(--volt-ink); font-weight:700; font-size:14px;
        display:flex; align-items:center; justify-content:center;
      }
      .steps li b{ color:var(--ink); }
      .codebox{
        background:#07090b; border:1px solid var(--line); border-radius:10px; padding:12px;
        font-size:12px; overflow-x:auto; white-space:pre; color:#cfe3c2; margin-top:10px;
        font-family:ui-monospace, Menlo, monospace;
      }
      details summary{ cursor:pointer; font-weight:700; padding:6px 0; }

      /* ---------- tab bar ---------- */
      .tabbar{
        position:fixed; left:0; right:0; bottom:0; z-index:40;
        background:rgba(13,16,19,.97); border-top:1px solid var(--line);
        padding-bottom:env(safe-area-inset-bottom);
      }
      .tabbar-in{ max-width:640px; margin:0 auto; display:grid; grid-template-columns:repeat(4,1fr); }
      .tab{
        background:none; border:none; color:var(--faint); padding:9px 0 7px;
        font-size:11.5px; font-weight:700; letter-spacing:.04em; text-transform:uppercase;
        display:flex; flex-direction:column; align-items:center; gap:3px; min-height:58px;
      }
      .tab svg{ width:23px; height:23px; }
      .tab.on{ color:var(--volt); }

      /* ---------- gate (sign in / create profile) ---------- */
      .gate{ min-height:100svh; display:flex; flex-direction:column; justify-content:center; padding:28px 0 40px; }
      .gate .mark{
        width:74px; height:74px; border-radius:20px; background:var(--volt);
        display:flex; align-items:center; justify-content:center; margin-bottom:18px;
      }
      .gate .mark svg{ width:40px; height:40px; color:var(--volt-ink); }
      .gate h1{ font-size:44px; line-height:.98; }
      .gate .lede{ color:var(--muted); margin-top:10px; font-size:16.5px; max-width:44ch; }
      .pin-dots{ display:flex; gap:12px; justify-content:center; margin:20px 0 6px; }
      .pin-dots span{ width:15px; height:15px; border-radius:50%; border:2px solid var(--faint); }
      .pin-dots span.fill{ background:var(--volt); border-color:var(--volt); }
      .pin-pad{ display:grid; grid-template-columns:repeat(3,74px); gap:10px; justify-content:center; margin-top:12px; }
      .pin-pad button{
        height:62px; border-radius:50%; border:1px solid var(--line); background:var(--panel);
        color:var(--ink); font-size:23px; font-weight:700;
      }
      .pin-pad button:active{ background:var(--panel2); }
      .shake{ animation:shake .3s; }
      @keyframes shake{ 25%{transform:translateX(-6px)} 75%{transform:translateX(6px)} }
      .toast{
        position:fixed; left:50%; transform:translateX(-50%) translateY(20px); bottom:96px; z-index:60;
        background:var(--volt); color:var(--volt-ink); font-weight:700; padding:11px 18px;
        border-radius:999px; opacity:0; pointer-events:none; transition:all .25s ease; font-size:15px;
        max-width:88vw; text-align:center;
      }
      .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
      .hidden{ display:none !important; }
      @media (prefers-reduced-motion: reduce){ *{ transition:none !important; animation:none !important; } }
    </style>
  </head>
  <body>
    <!-- ======================= GATE ======================= -->
    <div id="gate" class="wrap"></div>

    <!-- ======================= APP ======================= -->
    <div id="app" class="hidden">
      <header class="hud">
        <div class="wrap">
          <div class="hud-row">
            <div class="avatar" id="hudAvatar">?</div>
            <div>
              <div class="hud-name" id="hudName">Player</div>
              <div class="hud-sub" id="hudTitle">Rookie</div>
            </div>
            <div class="hud-right">
              <span class="pill streak" id="hudStreak" title="Workout-day streak"></span>
              <span class="pill level" id="hudLevel"></span>
            </div>
          </div>
          <div class="xpbar"><div id="xpFill" style="width:0%"></div></div>
          <div class="xp-meta"><span id="xpText">0 XP</span><span id="xpNext"></span></div>
        </div>
      </header>

      <main class="wrap">
        <section id="view-quest"></section>
        <section id="view-progress" class="hidden"></section>
        <section id="view-coach" class="hidden"></section>
        <section id="view-more" class="hidden"></section>
      </main>

      <nav class="tabbar">
        <div class="tabbar-in">
          <button class="tab on" data-tab="quest" type="button"></button>
          <button class="tab" data-tab="progress" type="button"></button>
          <button class="tab" data-tab="coach" type="button"></button>
          <button class="tab" data-tab="more" type="button"></button>
        </div>
      </nav>
    </div>

    <div class="toast" id="toast"></div>

    <script>
    "use strict";
    /* =====================================================================
       GYM TRACKER — a single-file quest-style workout tracker.
       All data lives in this browser's localStorage on this device only.
       Nothing is uploaded anywhere. Host it free on GitHub Pages.
       ===================================================================== */

    /* ---------------- program data (Sebastian's actual plan) ---------------- */
    var SESSIONS = {
      A: {
        label: "Session A", dayName: "Monday",
        sub: "Full-body dumbbells · Rest 60–90 sec between sets",
        exercises: [
          { id:"goblet",  name:"Goblet Squat",              sets:3, reps:"8–10",      weight:20, unit:"lb",        tip:"Hold one dumbbell at your chest, feet shoulder-width. Sit your hips down between your heels, chest tall, knees tracking over your toes. Drive up through your whole foot." },
          { id:"bench",   name:"Dumbbell Bench Press",      sets:3, reps:"8–10",      weight:15, unit:"lb each",   tip:"Dumbbells start over your chest, lower them slow until your upper arms are about parallel to the floor, then press up. Keep your feet planted and shoulder blades squeezed into the bench." },
          { id:"row1",    name:"One-Arm Dumbbell Row",      sets:3, reps:"10 / side", weight:20, unit:"lb",        tip:"Free hand and knee on the bench, back flat like a table. Pull the dumbbell to your hip — not your chest — and squeeze your back at the top. No twisting." },
          { id:"rdl",     name:"Dumbbell Romanian Deadlift", sets:3, reps:"10",      weight:25, unit:"lb each",   tip:"Soft knees, hinge at the hips and slide the dumbbells down your thighs, back flat the whole time. You should feel your hamstrings load up, not your lower back." },

          { id:"plank",   name:"Plank",                     sets:3, reps:"45 sec",    weight:null, unit:"bodyweight", tip:"Forearms down, body in one straight line from head to heels. Squeeze glutes and core, breathe steady. If your hips sag, reset — a shorter perfect plank beats a long sloppy one." }
        ]
      },
      B: {
        label: "Session B", dayName: "Wednesday",
        sub: "Full-body dumbbells · Rest 60–90 sec between sets",
        exercises: [
          { id:"lunge",   name:"Dumbbell Reverse Lunge",    sets:3, reps:"10 / leg",  weight:15, unit:"lb each",   tip:"Step back, drop the back knee toward the floor, front shin stays mostly vertical. Push through the front heel to stand. Torso tall, no wobbling side to side." },
          { id:"incline", name:"Incline Dumbbell Press",    sets:3, reps:"8–10",      weight:15, unit:"lb each",   tip:"Bench at about 30–45°. Same press mechanics as flat bench, but the dumbbells travel slightly higher toward your upper chest. Control the way down." },
          { id:"row2",    name:"Bent-Over Dumbbell Row",    sets:3, reps:"10",        weight:20, unit:"lb",        tip:"Hinge to about 45°, back flat, dumbbells hanging under your shoulders. Row both to your ribs and pause a second at the top. If your lower back rounds, the weight is too heavy." },
          { id:"thrust",  name:"Dumbbell Hip Thrust",       sets:3, reps:"12",        weight:25, unit:"lb each",   tip:"Upper back on the bench, dumbbells on your hips. Drive through your heels until your body is a straight line, squeeze your glutes hard for a second at the top." },

          { id:"deadbug", name:"Dead Bug",                  sets:3, reps:"10 / side", weight:null, unit:"bodyweight", tip:"Lower back pressed into the floor the whole time. Extend opposite arm and leg slowly, exhale as you reach. If your back arches off the floor, shorten the reach." }
        ]

      T: { label:"Trainer Session", dayName:"Thursday", sub:"Private session with your personal trainer — just show up and check in." }
    };
    var DEFAULT_SCHEDULE = { 1:"A", 3:"B", 4:"T" }; // JS weekday keys — Sebastian's days (Mon/Wed/Thu). Every user can override theirs in More → My Schedule.

       General, safe full-body fundamentals with rest days built in. These are

    function routineForAge(age){

    var DAY_ORDER = [1,2,3,4,5,6,0]; // Monday first

    function blankState(){
      return { profile:null, schedule:null, days:{}, weights:[], measures:[], photos:[], physiqueHistory:[], sports:[], practices:[], meals:[], createdAt:Date.now() };
    }
    function loadState(){
      try{
        var raw = localStorage.getItem(LS_KEY);
        if(!raw) return blankState();
        var s = JSON.parse(raw);
        if(!s || typeof s !== "object") return blankState();
        s.days = s.days || {}; s.weights = s.weights || []; s.measures = s.measures || []; s.photos = s.photos || [];
        s.physiqueHistory = Array.isArray(s.physiqueHistory) ? s.physiqueHistory : [];
        s.sports = Array.isArray(s.sports) ? s.sports : [];
        s.practices = Array.isArray(s.practices) ? s.practices : [];
        s.meals = Array.isArray(s.meals) ? s.meals : [];
        if(s.profile && !Array.isArray(s.profile.goals)){
          // Migrate the old single goal into a one-item list so nothing is wiped
          s.profile.goals = s.profile.goal ? [s.profile.goal] : [];
        }
        if(s.profile){
          // New profile fields start empty on older profiles — existing data is never backfilled or removed.
          s.profile.positions = cleanStringList(s.profile.positions);
        }
        if(s.schedule && typeof s.schedule === "object"){
          var ns = {};
          for(var di=0; di<7; di++){ var sv = s.schedule[di]; ns[di] = (sv==="A"||sv==="B"||sv==="T") ? sv : null; }
          s.schedule = ns;
        } else if(s.profile){
          // Profile created before schedules were customizable (Sebastian's) — keep his Mon/Wed/Thu plan as-is
          s.schedule = { 0:null, 1:"A", 2:null, 3:"B", 4:"T", 5:null, 6:null };
        }
        if(s.profile){
          var savedSessions = parseInt(s.profile.sessionsPerWeek, 10);
          var scheduledCount = scheduleWorkoutCount(s.schedule);
          // Keep the saved days exactly as they are. Older profiles get a target
          // from their existing schedule; an under-filled schedule gets the
          // minimum target so the app can prompt for more days, not erase any.
          s.profile.sessionsPerWeek = (savedSessions>=2 && savedSessions<=7) ? savedSessions : (scheduledCount>=2 ? scheduledCount : 2);
        }
        return s;
      }catch(e){ return blankState(); }
    }
    function save(){
      try{
        recordPhysiqueHistory(); // snapshot today's rating (once per day) so the journey is saved with the data
        localStorage.setItem(LS_KEY, JSON.stringify(state));

      catch(e){ toast("Storage is full — delete a progress photo to free space."); }
    }

    /* ---------------- date helpers ---------------- */
    function pad(n){ return (n<10?"0":"")+n; }
    function keyOf(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
    function todayKey(){ return keyOf(new Date()); }
    function parseKey(k){ var p=k.split("-"); return new Date(+p[0], +p[1]-1, +p[2]); }
    function addDays(d,n){ var x=new Date(d); x.setDate(x.getDate()+n); return x; }
    function effectiveSchedule(){ return state.schedule || DEFAULT_SCHEDULE; }
    function planFor(date){ return effectiveSchedule()[date.getDay()] || null; }
    function prettyDate(k){
      var d = parseKey(k);
      return d.toLocaleDateString(undefined,{weekday:"short", month:"short", day:"numeric"});
    }
    function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }

    /* ---------------- height (recorded stat, feet + inches) ---------------- */
    function heightLabel(totalIn){
      if(!totalIn || isNaN(totalIn)) return "";
      return Math.floor(totalIn/12)+"'"+(totalIn%12)+'"';

    function heightInputsHTML(prefix, currentIn){

        '<input class="text-in" id="'+prefix+'In" type="number" inputmode="numeric" min="0" max="11" step="1" placeholder="Inches" value="'+inch+'" aria-label="Height in inches">'+
      '</div>';

    function readHeightInputs(prefix){

      var inV = document.getElementById(prefix+"In").value.trim();

      var ft = parseInt(ftV,10), inch = inV==="" ? 0 : parseInt(inV,10);
      if(isNaN(ft) || isNaN(inch) || ft<3 || ft>8 || inch<0 || inch>11) return { ok:false };
      return { ok:true, heightIn: ft*12 + inch };
    }

    /* ---------------- profile list helpers ---------------- */
    function cleanStringList(values){
      var out = [];
      if(!Array.isArray(values)) return out;
      values.forEach(function(v){
        var text = String(v == null ? "" : v).trim();
        if(text && !out.some(function(x){ return x.toLowerCase()===text.toLowerCase(); })) out.push(text);
      });
      return out;
    }
    function profilePositions(){
      return state && state.profile ? cleanStringList(state.profile.positions) : [];
    }
    function currentWeightEntry(){
      if(!state || !Array.isArray(state.weights) || !state.weights.length) return null;
      var sorted = state.weights.slice().sort(function(a,b){ return a.date<b.date?-1:(a.date>b.date?1:0); });
      return sorted[sorted.length-1];
    }

    /* ---------------- schedule picker (choose your own workout days) ---------------- */
    function scheduleWorkoutCount(schedule){
      if(!schedule || typeof schedule !== "object") return 0;
      return Object.keys(schedule).filter(function(d){ return schedule[d]==="A" || schedule[d]==="B" || schedule[d]==="T"; }).length;
    }
    function validSessionsPerWeek(value, schedule){
      var n = parseInt(value, 10);
      if(n>=2 && n<=7) return n;
      var count = scheduleWorkoutCount(schedule);
      return count>=2 ? count : 3;
    }
    function scheduleFeedbackText(count, target){
      if(count===target) return count+" of "+target+" sessions set — ready to save.";
      if(count<target) return count+" of "+target+" sessions set — choose "+(target-count)+" more workout "+(target-count===1?"day":"days")+".";
      return count+" of "+target+" sessions set — "+(count-target)+" too many. Switch "+(count-target===1?"a day":"days")+" back to Rest or raise Sessions per week.";
    }
    function schedulePickerHTML(prefix, current, sessionsPerWeek){
      var cur = current || {};
      var target = validSessionsPerWeek(sessionsPerWeek, cur);
      var count = scheduleWorkoutCount(cur);
      var sessionOptions = "";
      for(var n=2;n<=7;n++) sessionOptions += '<option value="'+n+'"'+(target===n?" selected":"")+'>'+n+' sessions per week</option>';
      var html = '<div><label class="flabel" for="'+prefix+'-sessions">Sessions per week</label>'+
        '<select class="text-in" id="'+prefix+'-sessions">'+sessionOptions+'</select>'+
        '<p class="muted small" style="margin-top:4px">Session A, Session B and Trainer days count. Rest days do not.</p>'+
        '<p class="small" id="'+prefix+'-session-count" aria-live="polite" style="margin-top:8px"><b>'+esc(scheduleFeedbackText(count, target))+'</b></p></div>';
      html += DAY_ORDER.map(function(dn){
        var v = cur[dn] || "";
        function opt(val, label){ return '<option value="'+val+'"'+(v===val?" selected":"")+'>'+label+'</option>'; }
        return '<div class="sched-row"><span class="sched-day">'+DAY_NAMES[dn]+'</span>'+
          '<select class="text-in sched-sel" id="'+prefix+'-sched-'+dn+'" aria-label="'+DAY_NAMES[dn]+' plan">'+
          opt("","Rest")+opt("A","Session A")+opt("B","Session B")+opt("T","Trainer session")+
          '</select></div>';
      }).join("");
      return html;
    }
    function updateScheduleFeedback(prefix){
      var feedback = document.getElementById(prefix+"-session-count");
      if(!feedback) return;
      var targetEl = document.getElementById(prefix+"-sessions");
      var target = targetEl ? parseInt(targetEl.value, 10) : 0;
      var count = 0;
      DAY_ORDER.forEach(function(dn){
        var sel = document.getElementById(prefix+"-sched-"+dn);
        if(sel && sel.value) count++;
      });
      feedback.innerHTML = "<b>"+esc(scheduleFeedbackText(count, target))+"</b>";
    }
    function bindSchedulePicker(root, prefix){
      if(!root) return;
      var target = document.getElementById(prefix+"-sessions");
      if(target) target.addEventListener("change", function(){ updateScheduleFeedback(prefix); });
      DAY_ORDER.forEach(function(dn){
        var sel = document.getElementById(prefix+"-sched-"+dn);
        if(sel) sel.addEventListener("change", function(){ updateScheduleFeedback(prefix); });
      });
      updateScheduleFeedback(prefix);
    }
    function readSchedulePicker(prefix){
      var targetEl = document.getElementById(prefix+"-sessions");
      var target = targetEl ? parseInt(targetEl.value, 10) : NaN;
      if(isNaN(target) || target<2 || target>7) return { error:"Sessions per week must be a whole number from 2 to 7." };
      var sch = {}, count = 0;
      DAY_ORDER.forEach(function(dn){
        var sel = document.getElementById(prefix+"-sched-"+dn);
        var v = sel ? sel.value : "";
        sch[dn] = (v==="A"||v==="B"||v==="T") ? v : null;
        if(sch[dn]) count++;
      });
      if(count<2) return { error:"Pick at least 2 workout days — Session A, Session B or Trainer. Rest days do not count." };
      if(count!==target) return { error:scheduleFeedbackText(count, target)+" Your schedule was not saved." };
      return { schedule:sch, sessionsPerWeek:target, count:count };
    }
    function weekScheduledKeys(monDate){ // scheduled date-keys in the Mon-start week containing monDate
      var out = [];
      for(var i=0;i<7;i++){ var d = addDays(monDate, i); if(planFor(d)) out.push(keyOf(d)); }
      return out;
    }

    /* ---------------- day records ---------------- */
    function getDay(k){
      if(!state.days[k]){
        var type = planFor(parseKey(k));
        if(!type) return null;
        var rec = { type:type, sets:{}, effort:{}, pain:{}, trainer:false };
        if(type==="A" || type==="B"){
          SESSIONS[type].exercises.forEach(function(ex){
            rec.sets[ex.id] = [];
            for(var i=0;i<ex.sets;i++){
              var last = lastWeightFor(ex.id);
              rec.sets[ex.id].push({ done:false, w: last!=null? last : (ex.weight||0), r:"" });
            }
          });
        }
        state.days[k] = rec;
      }
      return state.days[k];
    }
    function sessionsOfType(type){
      return Object.keys(state.days).filter(function(k){ return state.days[k].type===type; }).sort();
    }
    function lastWeightFor(exId){
      var keys = Object.keys(state.days).sort();
      var best = null;
      for(var i=keys.length-1;i>=0;i--){
        var d = state.days[keys[i]];
        if(d.sets && d.sets[exId]){
          for(var j=0;j<d.sets[exId].length;j++){ if(d.sets[exId][j].done){ return d.sets[exId][j].w; } }
        }
      }
      return best;
    }
    function exerciseComplete(k, exId){
      var d = state.days[k]; if(!d || !d.sets[exId]) return false;
      return d.sets[exId].every(function(s){ return s.done; });
    }
    function dayComplete(k){
      var d = state.days[k]; if(!d) return false;
      if(d.type==="T") return !!d.trainer;
      return SESSIONS[d.type].exercises.every(function(ex){ return exerciseComplete(k, ex.id); });
    }
    function dayStarted(k){
      var d = state.days[k]; if(!d) return false;
      if(d.type==="T") return !!d.trainer;
      return Object.keys(d.sets).some(function(id){ return d.sets[id].some(function(s){ return s.done; }); });
    }
    function dayStatus(k){
      var type = planFor(parseKey(k));
      if(!type) return "rest";
      if(dayComplete(k)) return "done";
      if(parseKey(k) < parseKey(todayKey())) return "missed";
      return "planned";
    }

    /* ---------------- XP / levels ---------------- */
    function computeXP(){
      var xp = 0;
      Object.keys(state.days).forEach(function(k){
        var d = state.days[k];
        if(d.type==="T"){ if(d.trainer) xp += XP.trainer; return; }
        SESSIONS[d.type].exercises.forEach(function(ex){
          var sets = d.sets[ex.id] || [];
          sets.forEach(function(s){ if(s.done) xp += XP.set; });
          if(sets.length && sets.every(function(s){ return s.done; })) xp += XP.exerciseDone;
        });
        if(dayComplete(k)) xp += XP.dayDone;
      });
      xp += state.weights.length * XP.weighIn;
      xp += state.measures.length * XP.measures;
      xp += state.photos.length * XP.photo;
      xp += (state.practices||[]).length * XP.practice;
      xp += (state.meals||[]).length * XP.meal;
      return xp;
    }
    function levelFor(xp){
      // Level n needs 100 * (n-1) * n / 2 cumulative XP (100, 300, 600, 1000...)
      var lvl = 1;
      while(xp >= 100 * lvl * (lvl+1) / 2) lvl++;
      var floor = 100 * (lvl-1) * lvl / 2;
      var ceil  = 100 * lvl * (lvl+1) / 2;
      return { level:lvl, floor:floor, ceil:ceil, into:xp-floor, span:ceil-floor,
               title: LEVEL_TITLES[Math.min(lvl, LEVEL_TITLES.length)-1] };
    }

    /* ---------------- streaks ---------------- */
    function scheduledKeysBack(fromKey, count){
      var out = [], d = parseKey(fromKey), guard = 0;
      while(out.length < count && guard < 400){
        if(planFor(d)) out.push(keyOf(d));
        d = addDays(d, -1); guard++;
      }
      return out;
    }
    function currentStreak(){
      var tk = todayKey();
      var keys = scheduledKeysBack(tk, 60);
      var streak = 0;
      for(var i=0;i<keys.length;i++){
        if(keys[i]===tk && !dayComplete(tk)) continue; // today still in play
        if(dayComplete(keys[i])) streak++;
        else break;
      }
      return streak;
    }
    function bestStreak(){
      var keys = Object.keys(state.days).sort();
      if(!keys.length) return 0;
      var first = keys[0];
      var all = scheduledKeysBack(todayKey(), 400).filter(function(k){ return k>=first; }).reverse();
      var best=0, run=0;
      all.forEach(function(k){
        if(dayComplete(k)){ run++; if(run>best) best=run; } else if(k < todayKey()) run=0;
      });
      return best;
    }
    function perfectWeekStreak(){
      // consecutive Mon-start weeks (ending with the most recent finished week) where every scheduled day was done
      var now = new Date(); var dow = (now.getDay()+6)%7; // 0 = Monday
      var thisMonday = addDays(new Date(now.getFullYear(), now.getMonth(), now.getDate()), -dow);
      var streak = 0;
      for(var w=0; w<52; w++){
        var mon = addDays(thisMonday, -7*w);
        var keys = weekScheduledKeys(mon);
        if(!keys.length) break; // no workout days picked — no perfect weeks possible
        var allDone = keys.every(function(k){ return dayComplete(k); });
        if(w===0 && !allDone) continue; // current week still in progress — don't break the streak
        if(allDone) streak++; else break;
      }
      return streak;
    }
    function totalWorkouts(){
      return Object.keys(state.days).filter(function(k){ return dayComplete(k); }).length;
    }
    function totalSets(){
      var n=0;
      Object.keys(state.days).forEach(function(k){
        var d=state.days[k]; if(!d.sets) return;
        Object.keys(d.sets).forEach(function(id){ d.sets[id].forEach(function(s){ if(s.done) n++; }); });
      });
      return n;
    }
    /* Best (heaviest) weight ever logged per exercise, and the prescribed starting weight */
    function bestWeight(exId){
      var best = null;
      Object.keys(state.days).forEach(function(k){
        var d = state.days[k]; if(!d.sets || !d.sets[exId]) return;
        d.sets[exId].forEach(function(s){ if(s.done && s.w && (best===null || s.w>best)) best = s.w; });
      });
      return best;
    }
    function prescribedWeight(exId){
      var found = null;
      ["A","B"].forEach(function(t){ SESSIONS[t].exercises.forEach(function(ex){ if(ex.id===exId) found = ex.weight; }); });
      return found;
    }
    function improvedLifts(){
      var out = [];
      ["A","B"].forEach(function(t){ SESSIONS[t].exercises.forEach(function(ex){
        if(ex.weight==null) return;
        var b = bestWeight(ex.id);
        if(b!=null && b >= ex.weight + 5) out.push({ name:ex.name, from:ex.weight, to:b });
      });});
      return out;
    }

    /* ---------------- badges ---------------- */
    var TROPHY = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8M12 17v4M7 4h10v6a5 5 0 0 1-10 0V4z"/><path d="M7 6H4a1 1 0 0 0-1 1c0 2.5 1.8 4 4 4M17 6h3a1 1 0 0 1 1 1c0 2.5-1.8 4-4 4"/></svg>';
    function computeBadges(){
      var imp = improvedLifts();
      return [
        { id:"first-set",   name:"First Rep",        desc:"Check off your first set",        got: totalSets()>=1 },
        { id:"first-day",   name:"Quest Complete",   desc:"Finish a full workout day",       got: totalWorkouts()>=1 },
        { id:"trainer-1",   name:"Checked In",       desc:"Show up to a trainer session",    got: Object.keys(state.days).some(function(k){ return state.days[k].trainer; }) },

    function weekWasPerfect(){
      // any Mon-start week in history where every scheduled day was completed
      var keys = Object.keys(state.days);
      var seen = {};
      for(var i=0;i<keys.length;i++){
        var d = parseKey(keys[i]); var dow=(d.getDay()+6)%7;
        var mon = addDays(new Date(d.getFullYear(), d.getMonth(), d.getDate()), -dow);
        var monKey = keyOf(mon);
        if(seen[monKey]) continue; seen[monKey] = true;
        var wk = weekScheduledKeys(mon);
        if(wk.length && wk.every(function(k){ return dayComplete(k); })) return true;
      }
      return false;
    }

    /* ---------------- progress score (effort-based, never appearance) ----------------
       100 pts = 45 consistency + 35 strength progression + 20 tracking habits. */
    function progressScore(){
      // Consistency: scheduled days in the last 28 days that were completed
      var last28 = scheduledKeysBack(todayKey(), 12); // ~12 scheduled days in 28 days
      var doneCount = last28.filter(function(k){ return dayComplete(k); }).length;
      var pastDue = last28.filter(function(k){ return k < todayKey() || dayComplete(k); });
      var consistencyPct = pastDue.length ? doneCount/Math.max(pastDue.length,1) : 0;
      if(pastDue.length===0) consistencyPct = 0;
      var consistency = Math.round(consistencyPct * 45);

      // Strength: average % gain over prescribed start across weighted lifts you've improved
      var weighted = [];
      ["A","B"].forEach(function(t){ SESSIONS[t].exercises.forEach(function(ex){ if(ex.weight) weighted.push(ex); }); });
      var gains = weighted.map(function(ex){
        var b = bestWeight(ex.id);
        if(b==null) return 0;
        return Math.max(0, (b - ex.weight) / ex.weight); // e.g. 20 -> 26 = 0.30
      });
      var avgGain = gains.reduce(function(a,b){ return a+b; },0) / gains.length;
      var strength = Math.round(Math.min(avgGain/0.30, 1) * 35); // +30% average = full marks

      // Tracking habits: weigh-ins + measurement logs + photos in place
      var tracking = 0;
      tracking += Math.min(state.weights.length/4, 1) * 8;   // up to 8
      tracking += Math.min(state.measures.length/3, 1) * 8;  // up to 8
      tracking += Math.min(state.photos.length/2, 1) * 4;    // up to 4
      tracking = Math.round(tracking);

      return {
        total: consistency + strength + tracking,
        consistency: consistency, strength: strength, tracking: tracking,
        consistencyPct: Math.round(consistencyPct*100),
        avgGainPct: Math.round(avgGain*100),
        doneCount: doneCount, dueCount: pastDue.length
      };
    }
    function scoreVerdict(s){
      if(s.total>=80) return "Elite trajectory. This is what consistency looks like — keep stacking weeks like this.";
      if(s.total>=60) return "Strong progress. You're showing up and getting stronger — that's the whole game.";
      if(s.total>=40) return "Building momentum. A few more completed quests and this number jumps fast.";
      if(s.total>=15) return "You're on the board. Every checked set moves this score — one workout at a time.";
      return "Just getting started. Finish your first quest and watch this score move.";
    }

    /* ---------------- physique rating (PROGRESS over time only) ----------------
       Rates how your physique is changing: training consistency, strength
       progression vs your own starting weights, and your own measurement
       trends. Never grades appearance, never compares you to anyone else. */
    function latestLoggedWeight(exId){
      // Most recent day's heaviest completed set for this lift
      var keys = Object.keys(state.days).sort();
      for(var i=keys.length-1;i>=0;i--){
        var d = state.days[keys[i]];
        if(d.sets && d.sets[exId]){
          var best = null;
          d.sets[exId].forEach(function(s){ if(s.done && s.w && (best===null || s.w>best)) best = s.w; });
          if(best!==null) return best;
        }
      }
      return null;
    }
    function computePhysiqueRating(){
      // TRAINING /40 — consistency over the last 28 days, per your own schedule
      var now = new Date();
      var today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      var planned28 = 0, complete28 = 0;
      for(var i=0;i<28;i++){
        var d = addDays(today, -i);
        if(planFor(d)){ planned28++; if(dayComplete(keyOf(d))) complete28++; }
      }
      var training = planned28 ? Math.round(40 * complete28 / planned28) : 0;
      var dTraining = complete28 + "/" + planned28 + " training days in the last 4 weeks";

      // STRENGTH /30 — share of lifts now above your own starting (prescribed) weight
      var lifts = [];
      ["A","B"].forEach(function(t){ SESSIONS[t].exercises.forEach(function(ex){ if(ex.weight!=null) lifts.push(ex); }); });
      var gained = [];
      lifts.forEach(function(ex){
        var cur = latestLoggedWeight(ex.id);
        if(cur!=null && cur > ex.weight) gained.push({ name:ex.name, delta: Math.round((cur-ex.weight)*10)/10 });
      });
      var strength = lifts.length ? Math.round(30 * gained.length / lifts.length) : 0;
      var dStrength = gained.length
        ? ("Up: " + gained.map(function(g){ return g.name + " +" + g.delta + " lb"; }).join(", "))
        : "No lifts above baseline yet — small jumps still count";

      // MEASUREMENTS /30 — your latest check-in vs your first, same tape spots
      var m = sortedMeasures();
      var meas = 0, dMeas;
      if(m.length < 2){
        dMeas = "Add a second stats check-in to unlock measurement scoring";
      } else {
        var first = m[0], latest = m[m.length-1], parts = [], gainsCount = 0;
        [["chest","Chest"],["arm","Arms"],["thigh","Thighs"]].forEach(function(f){
          if(first[f[0]]!=null && latest[f[0]]!=null){
            var delta = Math.round((latest[f[0]]-first[f[0]])*100)/100;
            if(delta > 0){ gainsCount++; parts.push(f[1]+" +"+delta+'"'); }
            else if(delta < 0){ parts.push(f[1]+" "+delta+'"'); }
          }
        });
        var waistMoved = false;
        if(first.waist!=null && latest.waist!=null){
          var wd = Math.round((latest.waist-first.waist)*100)/100;
          if(Math.abs(wd) >= 0.25){ waistMoved = true; parts.push("Waist "+(wd>0?"+":"")+wd+'"'); }
        }
        meas = Math.min(30, gainsCount*8 + (waistMoved ? 6 : 0));
        dMeas = parts.length ? (parts.join(" · ") + " since your first check-in") : "No measurement movement yet between check-ins";
      }

      var score = training + strength + meas;
      var tier = score>=85 ? "Elite Pace" : score>=70 ? "On Fire" : score>=50 ? "Building" : score>=30 ? "Getting Going" : "Just Starting";
      return { score:score, tier:tier,
               parts:{ training:training, strength:strength, meas:meas },
               drivers:{ training:dTraining, strength:dStrength, meas:dMeas } };
    }
    /* ---------------- physique rating history (the journey) ----------------
       A snapshot of the computed rating, recorded at most once per day
       whenever the app saves (workout check-off, weight log, measurement
       log, photo, profile edit). Scores are only ever the live computed
       rating from real logged data — never preset, never backfilled.
       A fresh profile's first snapshot is honestly 0. */
    function recordPhysiqueHistory(){
      if(!state || !state.profile) return;
      var score = computePhysiqueRating().score;
      state.physiqueHistory = state.physiqueHistory || [];
      var hist = state.physiqueHistory;
      var tk = todayKey();
      var last = hist[hist.length-1];
      if(last && last.date === tk){ last.score = score; return; } // same day — keep the latest value
      hist.push({ date: tk, score: score });
    }

      if(hist.length < 2){

      }
      var start = hist[0], cur = hist[hist.length-1];
      var diff = cur.score - start.score;
      var rows = hist.slice(-8).reverse().map(function(h){
        return '<tr><td>'+esc(prettyDate(h.date))+'</td><td style="text-align:right;font-weight:700">'+h.score+' / 100</td></tr>';
      }).join("");

        '<p style="font-weight:700;font-size:19px">Your journey: '+start.score+' &rarr; '+cur.score+' <span style="color:var(--volt)">('+(diff>0?"+":"")+diff+')</span></p>'+
        '<p class="muted small" style="margin-top:3px">Started '+esc(prettyDate(start.date))+' · latest '+esc(prettyDate(cur.date))+(g ? ' · Goal: '+g.lo+'–'+g.hi : '')+'. Every point came from workouts you checked off, weights you logged, and measurements you took.</p>'+
        '<table class="hist"><tr><th>Date</th><th style="text-align:right">Physique rating</th></tr>'+rows+'</table></div>';
    }
    /* ---------------- physique rating goal band (user-set, optional) ----------------
       Each profile can set its own target range for the rating (e.g. 87–100).
       It is a personal goal marker only — it never changes how the score is

    function physiqueGoal(){

      if(g && typeof g.lo==="number" && typeof g.hi==="number" && g.lo>=0 && g.hi<=100 && g.lo<=g.hi) return g;

      '</div>';

    /* ---------------- coach critique engine (rule-based, reads your logs) ---------------- */
    function coachNotes(){
      var notes = [];
      var tk = todayKey();

      // 1) Pain flags -> deload advice (safety first)
      var painHits = [];
      Object.keys(state.days).sort().slice(-4).forEach(function(k){
        var d = state.days[k]; if(!d.pain) return;
        Object.keys(d.pain).forEach(function(id){
          if(d.pain[id]){
            var nm = id==="session" ? "your trainer session" : exerciseName(id);
            painHits.push({ day:k, name:nm });
          }
        });
      });
      if(painHits.length){
        var last = painHits[painHits.length-1];
        notes.push({ tone:"bad", title:"Pain flag on "+last.name, body:"You flagged pain on "+prettyDate(last.day)+". Drop that lift 20–30% lighter next time, keep reps smooth, and tell your trainer at your next trainer session. Sharp or joint pain = stop that exercise and tell a parent or your trainer. Training through pain is how small problems become big ones." });
      }

      // 2) Missed scheduled days (accountability)
      var past = scheduledKeysBack(tk, 6).filter(function(k){ return k < tk; });
      var missed = past.filter(function(k){ return !dayComplete(k); });
      if(missed.length && past.length){
        var m = missed[0];
        notes.push({ tone:"warn", title:"Missed quest: "+prettyDate(m), body:"That day didn't get finished, so the streak took the hit. No guilt trip — but the comeback rule is simple: never miss twice. Your next scheduled session is the most important one on the calendar." });
      }
      if(past.length>=3 && missed.length===0){
        notes.push({ tone:"good", title:"Perfect attendance lately", body:"Every scheduled session in your recent window is done. That reliability is exactly what builds strength — the workouts are almost the easy part." });
      }

      // 3) Progression praise (weights going up vs previous session of same type)
      ["A","B"].forEach(function(t){
        var keys = sessionsOfType(t).filter(function(k){ return dayStarted(k); });
        if(keys.length<2) return;
        var prevK = keys[keys.length-2], lastK = keys[keys.length-1];
        SESSIONS[t].exercises.forEach(function(ex){
          if(ex.weight==null) return;
          var prevBest = maxDoneWeight(prevK, ex.id), lastBest = maxDoneWeight(lastK, ex.id);
          if(prevBest!=null && lastBest!=null && lastBest>prevBest){
            notes.push({ tone:"good", title:"Progression: "+ex.name, body:"Up from "+prevBest+" lb to "+lastBest+" lb since your last "+SESSIONS[t].label+". That's real progressive overload — exactly how you get stronger. Keep the same jump size next time, no ego leaps." });
          }
        });
      });

      // 4) Repeatedly skipped exercise
      ["A","B"].forEach(function(t){
        var keys = sessionsOfType(t).filter(function(k){ return dayStarted(k) && !dayComplete(k); });
        if(keys.length<2) return;
        var lastTwo = keys.slice(-2);
        SESSIONS[t].exercises.forEach(function(ex){
          if(lastTwo.every(function(k){ return !exerciseComplete(k, ex.id); })){
            notes.push({ tone:"warn", title:"You keep skipping "+ex.name, body:"It went unfinished in your last two "+SESSIONS[t].label+" sessions. Whatever the reason — time, difficulty, boredom — do it FIRST next session while you're fresh. It's in the plan because it covers something the other lifts don't." });
          }
        });
      });

      // 5) Effort check: very high effort + no weight progress -> form focus; low effort -> push a little
      var efforts = [];
      Object.keys(state.days).sort().slice(-3).forEach(function(k){
        var d = state.days[k]; if(!d.effort) return;
        Object.keys(d.effort).forEach(function(id){ if(d.effort[id]) efforts.push(d.effort[id]); });
      });
      if(efforts.length>=3){
        var avg = efforts.reduce(function(a,b){return a+b;},0)/efforts.length;
        if(avg>=9) notes.push({ tone:"warn", title:"Effort is redlining", body:"Your recent effort ratings average "+avg.toFixed(1)+"/10. Training that hard every session isn't sustainable — most working sets should feel like a 7–8, where you could do 2–3 more reps with good form. Leave a little in the tank and you'll progress longer." });
        else if(avg<=4) notes.push({ tone:"warn", title:"Cruising a little", body:"Recent effort ratings average "+avg.toFixed(1)+"/10. If sets feel that easy with clean form, add 2.5–5 lb next session. Small jumps, good form — never max out." });
      }

      // 6) Weight trend (gentle, effort-framed)
      if(state.weights.length>=2){
        var w = state.weights.slice().sort(function(a,b){ return a.date<b.date?-1:1; });
        var first = w[0], latest = w[w.length-1];
        var diff = Math.round((latest.lbs - first.lbs)*10)/10;
        if(diff!==0){
          notes.push({ tone:"good", title:"Weight log: "+(diff>0?"+":"")+diff+" lb since "+prettyDate(first.date), body:"The scale is just data — what matters is that you're logging it and training consistently. Strength going up plus steady habits beats chasing the scale day to day. Weigh at the same time of day for numbers you can trust." });
        }
      } else {
        notes.push({ tone:"warn", title:"No weight trend yet", body:"Log your bodyweight on the Progress tab about once a week — same time of day, ideally morning. The chart needs data before it can tell you anything." });
      }

      // 6b) Sports practices this week
      var wkPracs = practicesThisWeek();
      if(wkPracs.length>=2){
        var wkMins = wkPracs.reduce(function(a,p){ return a+(+p.minutes||0); },0);
        notes.push({ tone:"good", title:"Athlete's week: "+wkPracs.length+" practices", body:"You logged "+wkPracs.length+" practices this week ("+wkMins+" minutes) on top of your gym days. That's a real two-way workload — it only pays off if sleep and food keep up with it. Recovery is where practice turns into progress." });
      } else if((state.sports||[]).length && (state.practices||[]).length===0){
        notes.push({ tone:"warn", title:"Practices aren't being logged", body:"You added "+state.sports.join(", ")+" as your sport"+(state.sports.length>1?"s":"")+" but no practices yet. Log them on the Progress tab — seeing gym plus practice in one place is how you catch weeks where the total load creeps too high." });
      }

      // 6c) Fuel check
      var mealsToday = mealsOn(tk).length;
      if(planFor(new Date()) && dayComplete(tk) && mealsToday===0){
        notes.push({ tone:"warn", title:"Big session, no fuel logged", body:"Today's quest is done but the Meal Fuel Log is empty. Training is the stimulus — food is the building material. Get a real meal in, protein included, and snap it into the Fuel Log on the Progress tab." });
      } else if(mealsToday>=2){
        notes.push({ tone:"good", title:"Fueling like you mean it", body:mealsToday+" meals logged today. Consistent fuel is the most underrated part of getting stronger — your future self says thanks." });
      }

      // 6d) Goal game plan — advice combined across EVERY goal picked
      var gks = profileGoals();
      if(gks.length){
        var gTips = gks.map(function(k){ return GOALS[k].coach; });
        notes.push({ tone:"good", title:"Game plan: "+goalLabels().join(" + "), body:"You're chasing "+gks.length+" goal"+(gks.length>1?"s":"")+" at once, so the plan blends all of them — not just the first one on the list. "+gTips.join(" ") });
      }

      // 7) Default encouragement when nothing else fired
      if(!notes.length){
        notes.push({ tone:"good", title:"Clean slate, let's work", body:"No red flags in your logs. Show up for the next quest, check off every set, and this panel will have real feedback for you soon." });
      }
      return notes;
    }
    function exerciseName(id){
      var nm = id;

    function maxDoneWeight(k, exId){
      var d = state.days[k]; if(!d || !d.sets[exId]) return null;
      var best = null;
      d.sets[exId].forEach(function(s){ if(s.done && s.w && (best===null || s.w>best)) best = s.w; });
      return best;
    }
    /* Is this set a PR? (heavier than any previously logged done set for that exercise, before this day) */
    function isPR(k, exId, w){
      if(!w) return false;
      var prev = null;
      Object.keys(state.days).forEach(function(dk){
        if(dk>=k) return;
        var d = state.days[dk]; if(!d.sets || !d.sets[exId]) return;
        d.sets[exId].forEach(function(s){ if(s.done && s.w && (prev===null || s.w>prev)) prev = s.w; });
      });
      return prev!==null && w>prev;
    }

    function bindQuest(el, k){
      el.querySelectorAll("[data-date]").forEach(function(b){
        b.addEventListener("click", function(){ selectedDate = b.getAttribute("data-date"); renderQuest(); });
      });
      el.querySelectorAll("[data-tip]").forEach(function(b){
        b.addEventListener("click", function(){
          var box = document.getElementById("tip-"+b.getAttribute("data-tip"));
          if(box) box.classList.toggle("open");
        });
      });
      el.querySelectorAll("[data-check]").forEach(function(b){
        b.addEventListener("click", function(){
          var parts = b.getAttribute("data-check").split(":"); var exId = parts[0], idx = +parts[1];
          var day = getDay(k); var s = day.sets[exId][idx];
          var before = computeXP();
          s.done = !s.done;
          save();
          if(s.done){
            var gained = computeXP()-before;
            if(isPR(k, exId, s.w)) toast("New PR on "+exerciseName(exId)+" — "+s.w+" lb! +"+gained+" XP");
            else toast("Set checked off · +"+gained+" XP");
            if(dayComplete(k)) setTimeout(function(){ toast("Quest complete! Bonus XP banked."); }, 350);
          }
          renderAll();
        });
      });
      el.querySelectorAll("[data-w]").forEach(function(inp){
        inp.addEventListener("change", function(){
          var parts = inp.getAttribute("data-w").split(":");
          var day = getDay(k);
          day.sets[parts[0]][+parts[1]].w = Math.max(0, parseFloat(inp.value)||0);
          save(); renderAll();
        });
      });
      el.querySelectorAll("[data-r]").forEach(function(inp){
        inp.addEventListener("change", function(){

      });

    /* ---------------- progress view ---------------- */
    function weightChartSVG(){
      var pts = state.weights.slice().sort(function(a,b){ return a.date<b.date?-1:1; });
      if(pts.length<2) return '<p class="muted small" style="margin-top:10px">Log at least two weigh-ins and your progress line shows up here.</p>';
      var W=560, H=190, PL=44, PR=12, PT=14, PB=26;
      var vals = pts.map(function(p){ return p.lbs; });
      var min = Math.min.apply(null, vals), max = Math.max.apply(null, vals);
      if(max-min<4){ var mid=(max+min)/2; min=mid-2; max=mid+2; }
      var iw = W-PL-PR, ih = H-PT-PB;
      function X(i){ return PL + (pts.length===1? iw/2 : iw*i/(pts.length-1)); }
      function Y(v){ return PT + ih - (v-min)/(max-min)*ih; }
      var line = pts.map(function(p,i){ return (i===0?"M":"L")+X(i).toFixed(1)+","+Y(p.lbs).toFixed(1); }).join(" ");
      var dots = pts.map(function(p,i){ return '<circle cx="'+X(i)+'" cy="'+Y(p.lbs)+'" r="4" fill="#b7f04a"/>'; }).join("");
      return '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto;display:block;margin-top:10px" role="img" aria-label="Bodyweight over time chart">'+
        '<line x1="'+PL+'" y1="'+PT+'" x2="'+PL+'" y2="'+(PT+ih)+'" stroke="#262d33"/>'+
        '<line x1="'+PL+'" y1="'+(PT+ih)+'" x2="'+(W-PR)+'" y2="'+(PT+ih)+'" stroke="#262d33"/>'+
        '<text x="'+(PL-6)+'" y="'+(Y(max)+4)+'" fill="#93a29b" font-size="12" text-anchor="end">'+max.toFixed(0)+'</text>'+
        '<text x="'+(PL-6)+'" y="'+(Y(min)+4)+'" fill="#93a29b" font-size="12" text-anchor="end">'+min.toFixed(0)+'</text>'+
        '<text x="'+(PL-6)+'" y="'+(Y((max+min)/2)+4)+'" fill="#93a29b" font-size="12" text-anchor="end">lb</text>'+
        '<path d="'+line+'" fill="none" stroke="#b7f04a" stroke-width="2.5" stroke-linejoin="round"/>'+ dots +
        '<text x="'+PL+'" y="'+(H-6)+'" fill="#93a29b" font-size="12">'+esc(prettyDate(pts[0].date))+'</text>'+
        '<text x="'+(W-PR)+'" y="'+(H-6)+'" fill="#93a29b" font-size="12" text-anchor="end">'+esc(prettyDate(pts[pts.length-1].date))+'</text>'+
        '</svg>';
    }
    function sortedWeights(){ return state.weights.slice().sort(function(a,b){ return a.date<b.date?-1:1; }); }
    function sortedMeasures(){ return state.measures.slice().sort(function(a,b){ return a.date<b.date?-1:1; }); }

    /* ---------------- practices & meals helpers ---------------- */
    function sortedPractices(){ return (state.practices||[]).slice().sort(function(a,b){ return a.date<b.date?-1:(a.date>b.date?1:0); }); }
    function sortedMeals(){ return (state.meals||[]).slice().sort(function(a,b){ return a.date<b.date?-1:(a.date>b.date?1:0); }); }
    function mealsOn(k){ return (state.meals||[]).filter(function(m){ return m.date===k; }); }
    function dayCalories(k){ // manual/label entries only — never estimated from photos
      return mealsOn(k).reduce(function(a,m){ return a + (m.kcal!=null ? m.kcal : 0); }, 0);
    }
    function practicesThisWeek(){
      var start = keyOf(addDays(new Date(),-6)), tk = todayKey();
      return sortedPractices().filter(function(p){ return p.date>=start && p.date<=tk; });
    }
    function currentTimeVal(){
      var n = new Date();
      return pad(n.getHours())+":"+pad(n.getMinutes());
    }

    /* All goal keys this profile has picked (migrates the old single goal). */
    function profileGoals(){
      var p = state.profile; if(!p) return [];
      var list = Array.isArray(p.goals) ? p.goals : (p.goal ? [p.goal] : []);
      var out = [];
      list.forEach(function(k){ if(GOALS[k] && out.indexOf(k)<0) out.push(k); });

    }

    function bindChipToggles(root){
      if(!root) return;
      root.querySelectorAll("[data-goalchip], [data-sportchip], [data-positionchip]").forEach(function(chip){
        chip.addEventListener("click", function(){ chip.classList.toggle("on"); });
      });

    function readChipValues(root, attribute){
      if(!root) return [];
      var values = [];
      root.querySelectorAll("["+attribute+"].on").forEach(function(chip){ values.push(chip.getAttribute(attribute)); });
      return cleanStringList(values);
    }
    function addCustomChip(container, attribute, value){
      if(!container) return;
      var existing = null;
      container.querySelectorAll("["+attribute+"]").forEach(function(chip){
        if(chip.getAttribute(attribute).toLowerCase()===value.toLowerCase()) existing = chip;
      });
      if(existing){ existing.classList.add("on"); return; }
      var chip = document.createElement("button");
      chip.type = "button";
      chip.className = "tag-chip on";
      chip.setAttribute(attribute, value);
      chip.textContent = value;
      chip.addEventListener("click", function(){ chip.classList.toggle("on"); });
      container.appendChild(chip);
    }
    function bindCustomChipInput(root, inputId, buttonId, containerId, attribute, isPosition){
      var button = document.getElementById(buttonId);
      var input = document.getElementById(inputId);
      if(!button || !input) return;
      function add(){
        var value = input.value.trim();
        if(!value) return;
        var container = document.getElementById(containerId);
        if(isPosition && container){
          var existingPosition = null;
          container.querySelectorAll("["+attribute+"]").forEach(function(chip){
            if(chip.getAttribute(attribute).toLowerCase()===value.toLowerCase()) existingPosition = chip;
          });
          if(existingPosition) existingPosition.classList.add("on");
          else {
            var customList = container.querySelector("[data-custom-position-list]");
            addCustomChip(customList || container, attribute, value);
          }
        } else {
          addCustomChip(container, attribute, value);
        }
        input.value = "";
        input.focus();
      }
      button.addEventListener("click", add);
      input.addEventListener("keydown", function(e){ if(e.key==="Enter"){ e.preventDefault(); add(); } });
    }

    function coachChatHTML(){
      var tk = todayKey();
      var msgs = [];

      if(streak>0) bits.push("you're riding a <b>"+streak+"-workout streak</b>");
