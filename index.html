      if(doneKeys.length){
        var lk = doneKeys[doneKeys.length-1], lt = state.days[lk].type;
        bits.push("last session banked: <b>"+(lt==="T"?"Trainer Session":SESSIONS[lt].label)+"</b> on "+prettyDate(lk));
      }
      msgs.push("What's up, "+esc(state.profile.name)+". "+(bits.length ? "Here's what your logs are telling me: "+bits.join(" · ")+"." : "Your logs are a blank page so far — let's write the first line. Check off a workout and I'll have real reads for you."));
      var typeToday = planFor(new Date());
      if(typeToday){
        if(dayComplete(tk)) msgs.push("Today's quest — <b>"+(typeToday==="T"?"Trainer Session":SESSIONS[typeToday].label)+"</b> — is already cleared. Work's done. Now the other half of training: eat, hydrate, sleep.");
        else if(typeToday==="T") msgs.push("Today is a <b>trainer day</b>. Nothing to check off lift-by-lift here — just show up, check in, and let your trainer run it. That's your next move.");
        else msgs.push("Today's quest is <b>"+SESSIONS[typeToday].label+"</b> and it's still open. That's your next move — everything else today is bonus.");
      } else {
        var nd = new Date(); var guard = 0;
        while(!planFor(nd) && guard<8){ nd = addDays(nd,1); guard++; }
        msgs.push("Today's a <b>rest day</b> on your schedule. Next up: <b>"+SESSIONS[planFor(nd)].label+"</b> · "+prettyDate(keyOf(nd))+". Recover today so you show up dangerous.");
      }
      var chatGoals = profileGoals();
      if(chatGoals.length){
        msgs.push("Your goals on the board: <b>"+goalLabels().map(function(l){ return esc(l); }).join("</b> + <b>")+"</b>. Everything I read — food, load, recovery — gets judged against all of them together, so the advice you get here is built for the whole combination.");
      }
      var extra = [];
      var wkP = practicesThisWeek();
      if(wkP.length){
        var wkM = wkP.reduce(function(a,p){ return a+(+p.minutes||0); }, 0);
        extra.push("<b>"+wkP.length+" practice"+(wkP.length>1?"s":"")+"</b> this week ("+wkM+" min)");
      }
      var mt = mealsOn(tk).length;
      if(mt) extra.push("<b>"+mt+" meal"+(mt>1?"s":"")+"</b> in the Fuel Log today");
      if(extra.length) msgs.push("Also on the board: "+extra.join(" · ")+". Gym + sport + fuel, stacked together — that's how athletes are actually built.");
      var hist = (state.physiqueHistory||[]).slice().sort(function(a,b){ return a.date<b.date?-1:1; });
      if(hist.length>=2){
        var dScore = hist[hist.length-1].score - hist[0].score;
        if(dScore>0) msgs.push("And look at this: your Physique Rating has climbed <b>"+hist[0].score+" → "+hist[hist.length-1].score+"</b> (+"+dScore+"). That's not talk — that's your own check-ins adding up.");
        else if(dScore===0) msgs.push("Your Physique Rating is holding at <b>"+hist[hist.length-1].score+"</b>. Holding for a week is fine — the next jump comes from one more consistent week, not one heroic day.");
      }
      msgs.push(streak>=3 ? "Protect the streak. One session at a time, no zero days on the days YOU picked. Let's work." : "One session at a time. Finish the next quest in front of you and the numbers take care of themselves. Let's work.");
      var rows = msgs.map(function(m, i){
        return '<div class="chat-row"><div class="chat-av"'+(i>0?' style="visibility:hidden"':"")+' aria-hidden="true">AI</div><div class="bubble">'+m+'</div></div>';
      }).join("");
      return '<div class="card" style="margin-top:12px"><div style="font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)">AI Coach · from your logs</div>'+rows+
        '<p class="muted small" style="margin-top:12px">How this works, honestly: I\'m a built-in coach that reads your logs right here on this device and writes these messages from your numbers. I\'m not a live AI chat, and nothing you log is sent anywhere.</p></div>';
    }

    /* ---------------- coach view ---------------- */
    function renderCoach(){
      var el = document.getElementById("view-coach");
      var notes = coachNotes();
      var html = '<h2 class="sect-title">Coach\'s Corner</h2>'+
        '<p class="muted" style="margin-top:4px">Your AI-style coach reads your actual logs — workouts, practices, meals, weights, effort, pain flags — and talks to you straight, like a coach, not a spreadsheet.</p>'+
        coachChatHTML()+
        '<h2 class="sect-title">The Breakdown</h2>';
      notes.forEach(function(n){
        html += '<div class="coach-card '+n.tone+'"><div class="who">Coach</div><h3>'+esc(n.title)+'</h3><p class="small" style="margin-top:2px">'+esc(n.body)+'</p></div>';
      });
      var imp = improvedLifts();
      html += '<div class="card"><h2>Strength report</h2>';
      if(imp.length){
        html += '<table class="hist"><tr><th>Lift</th><th>Started</th><th>Best now</th></tr>'+
          imp.map(function(x){ return '<tr><td>'+esc(x.name)+'</td><td>'+x.from+' lb</td><td style="color:var(--volt);font-weight:700">'+x.to+' lb</td></tr>'; }).join("")+'</table>';
      } else {
        html += '<p class="muted small" style="margin-top:6px">No lifts have beaten their starting weight by 5 lb yet. When a full session at a weight feels like a 7–8 effort with clean form, add 2.5–5 lb next time — small, steady jumps. Loads stay moderate; never chase a max.</p>';
      }
      html += '<p class="muted small" style="margin-top:12px">Standing rules: stop any exercise that causes sharp pain and tell a parent or your trainer. Eat enough to fuel training and growth — this coach will never tell you to starve a workout.</p></div>';
      el.innerHTML = html;
    }

    /* ---------------- more view: badges, install, reminders, share, github ---------------- */
    var SW_CODE = [
      "/* Gym Tracker service worker — save as sw.js next to index.html */",
      "const CACHE = 'gym-tracker-v1';",
      "const FILES = ['./', './index.html', './manifest.json'];",
      "self.addEventListener('install', e => {",
      "  e.waitUntil(caches.open(CACHE).then(c => c.addAll(FILES)).then(() => self.skipWaiting()));",
      "});",
      "self.addEventListener('activate', e => { e.waitUntil(self.clients.claim()); });",
      "self.addEventListener('fetch', e => {",
      "  e.respondWith(caches.match(e.request).then(r => r || fetch(e.request)));",
      "});"
    ].join("\n");
    var MANIFEST_CODE = [
      '{',
      '  "name": "Gym Tracker", "short_name": "Gym Tracker",',
      '  "start_url": ".", "scope": ".", "display": "standalone",',
      '  "background_color": "#0b0e11", "theme_color": "#0b0e11",',
      '  "icons": [',
      '    { "src": "icon-192.png", "sizes": "192x192", "type": "image/png" },',
      '    { "src": "icon-512.png", "sizes": "512x512", "type": "image/png" }',
      '  ]',
      '}'
    ].join("\n");

    function renderMore(){
      var el = document.getElementById("view-more");
      var badges = computeBadges();
      var got = badges.filter(function(b){ return b.got; }).length;
      var inIframe = window.self !== window.top;
      var standalone = window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true;

      var html = '<h2 class="sect-title">Trophy Case</h2>'+
      '<p class="muted small">'+got+' of '+badges.length+' badges earned. Best streak: '+bestStreak()+' workout days · Perfect-week streak: '+perfectWeekStreak()+'.</p>'+
      '<div class="badge-grid">'+ badges.map(function(b){
          return '<div class="badge '+(b.got?"unlocked":"locked")+'">'+TROPHY+'<div class="bn">'+esc(b.name)+'</div><div class="bd">'+esc(b.desc)+'</div></div>';
        }).join("")+'</div>';

      /* my schedule */
      var currentSchedule = effectiveSchedule();
      var currentScheduleCount = scheduleWorkoutCount(currentSchedule);
      var currentSessionsTarget = validSessionsPerWeek(state.profile.sessionsPerWeek, currentSchedule);
      var schedulePrompt = "";
      if(currentScheduleCount<2){
        schedulePrompt = '<p class="small" style="margin-top:8px"><b>Your saved schedule has only '+currentScheduleCount+' workout '+(currentScheduleCount===1?"day":"days")+'.</b> Add workout days below to reach your Sessions per week setting — your existing days have not been changed or removed.</p>';
      } else if(currentScheduleCount!==currentSessionsTarget){
        schedulePrompt = '<p class="small" style="margin-top:8px"><b>Your saved schedule has '+currentScheduleCount+' workout days, but Sessions per week is set to '+currentSessionsTarget+'.</b> Adjust either one below so they match — nothing has been changed yet.</p>';
      }
      html += '<h2 class="sect-title">My Schedule</h2><div class="card" style="margin-top:10px">'+
        '<p>Your workout days are yours to set — quests, streaks, XP and the Progress Score all follow <b>your</b> days. A rest day never breaks a streak; only a missed day you picked does.</p>'+
        '<p class="muted small" style="margin-top:6px">No trainer? No problem — set that day to Session A or B, or rest. Trainer days stay check-in only: no programmed exercises, your trainer runs those.</p>'+
        schedulePrompt+
        '<div style="margin-top:8px">'+schedulePickerHTML("ms", currentSchedule, currentSessionsTarget)+'</div>'+
        '<div class="btn-row"><button class="btn" type="button" id="schedSave">Save my schedule</button></div>'+
      '</div>';

      /* starter routine matched to age */
      html += starterRoutineHTML();

      /* share */
      html += '<h2 class="sect-title">Share With Friends</h2><div class="card" style="margin-top:10px">'+
        '<p>Send the link to this app to a friend and they get the exact same tracker — with <b>their own</b> profile, XP and streaks on <b>their own</b> phone.</p>'+
        '<p class="muted small" style="margin-top:8px">Real talk: there is no shared leaderboard and nobody can see anybody else\'s data. The app has no server — everything is saved privately on each person\'s device. That\'s a feature: your numbers stay yours.</p>'+
        '<p class="small" style="margin-top:10px">To share it: send your friends the link to this page (the GitHub Pages address once it\'s hosted — copy it from the browser address bar, or use the Share button wherever you\'re viewing this). They open it, tap "Start my first quest," and they\'re in.</p>'+
      '</div>';

      /* install */
      html += '<h2 class="sect-title">Install As An App</h2><div class="card" style="margin-top:10px">'+
        (standalone
          ? '<p style="font-weight:700;color:var(--volt)">You\'re running the installed app right now. Full screen, home-screen icon, works offline once hosted with the service worker.</p>'
          : '<p>Free, no App Store, takes 20 seconds. On <b>iPhone</b>:</p>'+
            '<ol class="steps"><li>Open this page in <b>Safari</b> (the link has to be the real hosted one).</li>'+
            '<li>Tap the <b>Share</b> button (square with an arrow pointing up).</li>'+
            '<li>Scroll down and tap <b>Add to Home Screen</b>.</li>'+
            '<li>Tap <b>Add</b>. Gym Tracker now sits on your home screen like a real app.</li></ol>'+
            '<p class="muted small" style="margin-top:6px">On Android/Chrome: open the link, tap the three-dot menu, then <b>Install app</b> or <b>Add to Home screen</b>.</p>')+
      '</div>';

      /* reminders — honest version */
      html += '<h2 class="sect-title">Reminders</h2><div class="card" style="margin-top:10px">'+
        '<p><b>The straight truth about notifications:</b> this app is a static page with no server, so it can\'t send you background push notifications by itself — any app that promises that without a server is faking it.</p>'+
        '<p class="muted small" style="margin-top:8px">So here\'s how reminders actually work:</p>'+
        '<p class="small" style="margin-top:8px"><b style="color:var(--ink)">For Sebastian:</b> your push nudges come from Muse, your assistant, which already reminds you on gym days. This app\'s job is to show today\'s quest the second you open it — that\'s why it lives on your home screen.</p>'+
        '<p class="small" style="margin-top:8px"><b style="color:var(--ink)">For friends:</b> Muse\'s reminders only reach Sebastian — they don\'t go to you. Set your own phone reminder instead: download the gym-days calendar below and your phone will nudge you on the workout days you picked in My Schedule. Same effect, zero fake promises.</p>'+
        '<div class="btn-row"><button class="btn secondary" type="button" id="icsBtn">Download gym-day reminders (.ics)</button></div>'+
        '<p class="muted small" style="margin-top:8px">Opens in Apple Calendar / Google Calendar — weekly on your workout days at 4:00 PM: "Open Gym Tracker — today\'s quest is waiting."</p>'+
      '</div>';

      /* github */
      html += '<h2 class="sect-title">Put It On GitHub</h2><div class="card" style="margin-top:10px">'+
        '<p>This whole app is one file. To host it free on GitHub Pages:</p>'+
        '<ol class="steps"><li>Create a new public repo (e.g. <b>gym-tracker</b>).</li>'+
        '<li>Upload this page saved as <b>index.html</b>.</li>'+
        '<li>Add the two helper files below — <b>sw.js</b> makes it work offline, <b>manifest.json</b> powers the install.</li>'+
        '<li>Repo <b>Settings → Pages → Deploy from branch → main</b>. Your link goes live in about a minute.</li></ol>'+
        '<details><summary>sw.js — tap to view / copy</summary><div class="codebox">'+esc(SW_CODE)+'</div>'+
        '<div class="btn-row"><button class="btn secondary" type="button" id="dlSw">Download sw.js</button></div></details>'+
        '<details><summary>manifest.json — tap to view / copy</summary><div class="codebox">'+esc(MANIFEST_CODE)+'</div>'+
        '<div class="btn-row"><button class="btn secondary" type="button" id="dlManifest">Download manifest.json</button></div></details>'+
        '<p class="muted small" style="margin-top:10px">Icons: any 192×192 and 512×512 PNG named icon-192.png / icon-512.png works next to the manifest.</p>'+
      '</div>';

      /* profile */
      var profileWeight = currentWeightEntry();
      var profileSports = state.sports || [];
      var profilePositionList = profilePositions();
      html += '<h2 class="sect-title">Profile</h2><div class="card" style="margin-top:10px">'+
        '<p>Signed in as <b>'+esc(state.profile.name)+'</b> · Level '+levelFor(computeXP()).level+' '+levelFor(computeXP()).title+'</p>'+
        '<p style="margin-top:6px">Age: <b>'+(state.profile.age ? state.profile.age : 'not set yet')+'</b> · Height: <b>'+(state.profile.heightIn ? esc(heightLabel(state.profile.heightIn)) : 'not set yet')+'</b> · Current weight: <b>'+(profileWeight ? profileWeight.lbs+' lb' : 'not set yet')+'</b></p>'+
        '<p style="margin-top:6px">Goals: <b>'+(goalLabel() ? esc(goalLabel()) : 'not set yet')+'</b></p>'+
        '<p style="margin-top:6px">Sports: <b>'+(profileSports.length ? esc(profileSports.join(" · ")) : 'not set yet')+'</b></p>'+
        '<p style="margin-top:6px">Positions: <b>'+(profilePositionList.length ? esc(profilePositionList.join(" · ")) : 'not set yet')+'</b></p>'+
        '<div style="margin-top:10px"><label class="flabel" for="pfAgeEdit">Your age (roughly is fine)</label>'+
        '<input class="text-in" id="pfAgeEdit" type="number" inputmode="numeric" step="1" placeholder="e.g. 13" value="'+(state.profile.age || "")+'"></div>'+
        '<div style="margin-top:10px"><label class="flabel">Your height — feet &amp; inches</label>'+
        heightInputsHTML("ht", state.profile.heightIn || null)+'</div>'+
        '<div style="margin-top:10px"><label class="flabel" for="pfWeightEdit">Your current weight (lb)</label>'+
        '<input class="text-in" id="pfWeightEdit" type="number" inputmode="decimal" step="0.1" min="40" max="600" placeholder="e.g. 132.5" value="'+(profileWeight ? profileWeight.lbs : "")+'">'+
        '<p class="muted small" style="margin-top:4px">This comes from your Bodyweight log. Changing it here adds or updates today\'s weigh-in; your earlier weigh-ins stay in the history.</p></div>'+
        '<div style="margin-top:10px"><label class="flabel">Your goals — tap to pick as many as fit</label>'+
        '<div id="editGoalChips">'+goalChipsHTML(profileGoals())+'</div>'+
        '<p class="muted small" style="margin-top:4px">Pick one, pick five — the coach, the starter routine and the Meal Fuel Log all tailor themselves to the whole combination. Goals frame the advice only; they never set a calorie target for you — that number is always yours to type in.</p></div>'+
        '<div style="margin-top:10px"><label class="flabel" for="pfGoalCustom">Custom goal in your words (used when Custom is picked above)</label>'+
        '<input class="text-in" id="pfGoalCustom" type="text" maxlength="60" placeholder="Type it in your own words" value="'+esc(state.profile.goalCustom || "")+'"></div>'+
        '<div style="margin-top:10px"><label class="flabel">Your sports — tap to pick as many as you play</label>'+
        '<div id="editSportChips">'+sportChipsHTML(profileSports)+'</div>'+
        '<p class="muted small" style="margin-top:4px">Saving these also updates the sports list in Sports Practices.</p>'+
        '<div style="display:flex;gap:10px;margin-top:4px"><input class="text-in" id="editSportCustom" type="text" maxlength="30" placeholder="Or type another sport"><button class="btn secondary" type="button" id="editSportAdd" style="width:auto;flex:none;padding:12px 16px;min-height:48px">Add</button></div></div>'+
        '<div style="margin-top:10px"><label class="flabel">Your positions — tap to pick as many as you play</label>'+
        '<div id="editPositionChips">'+positionChipsHTML(profilePositionList)+'</div>'+
        '<div style="display:flex;gap:10px;margin-top:8px"><input class="text-in" id="editPositionCustom" type="text" maxlength="40" placeholder="Or type another position"><button class="btn secondary" type="button" id="editPositionAdd" style="width:auto;flex:none;padding:12px 16px;min-height:48px">Add</button></div></div>'+
        '<div style="margin-top:10px"><label class="flabel" for="pfCalEdit">Calories section in the Meal Fuel Log</label>'+
        '<select class="text-in" id="pfCalEdit">'+
          '<option value="on"'+(state.profile.showCalories===false?"":" selected")+'>Show calories section</option>'+
          '<option value="off"'+(state.profile.showCalories===false?" selected":"")+'>Hide it — photo fuel log only</option>'+
        '</select>'+
        '<p class="muted small" style="margin-top:4px">Hide it and no calorie target, total, or deficit shows anywhere for this profile — just meal photos, names and fuel tags.</p></div>'+
        '<div class="btn-row"><button class="btn secondary" type="button" id="htSave">Save profile</button></div>'+
        '<p class="muted small" style="margin-top:6px">Your data lives only in this browser on this device. Switching phones or clearing browser data starts you fresh — that\'s the trade-off of a free, private, no-account app.</p>'+
        '<div class="btn-row"><button class="btn secondary" type="button" id="lockBtn">'+(state.profile.pin?"Lock app":"Sign out view")+'</button>'+
        '<button class="btn danger" type="button" id="wipeBtn">Erase everything</button></div>'+
      '</div>';

      el.innerHTML = html;

      bindSchedulePicker(el, "ms");
      bindChipToggles(el);
      bindCustomChipInput(el, "editSportCustom", "editSportAdd", "editSportChips", "data-sportchip", false);
      bindCustomChipInput(el, "editPositionCustom", "editPositionAdd", "editPositionChips", "data-positionchip", true);
      document.getElementById("schedSave").addEventListener("click", function(){
        var pickedSchedule = readSchedulePicker("ms");
        if(pickedSchedule.error){ toast(pickedSchedule.error); return; }
        state.schedule = pickedSchedule.schedule;
        state.profile.sessionsPerWeek = pickedSchedule.sessionsPerWeek;
        // Rebuild upcoming days that haven't been started yet so they match the new plan;
        // anything already logged (sets done / trainer checked in) is left untouched.
        Object.keys(state.days).forEach(function(k){
          if(k>=todayKey() && !dayStarted(k) && state.days[k].type !== planFor(parseKey(k))) delete state.days[k];
        });
        save(); toast("Schedule saved — quests and streaks follow your days now."); renderAll();
      });
      document.getElementById("htSave").addEventListener("click", function(){
        var ht = readHeightInputs("ht");
        if(!ht.ok){ toast("Height looks off — feet 3–8, inches 0–11."); return; }
        var weightText = document.getElementById("pfWeightEdit").value.trim();
        var editedWeight = null;
        if(weightText!==""){
          editedWeight = parseFloat(weightText);
          if(isNaN(editedWeight) || editedWeight<40 || editedWeight>600){ toast("Current weight needs to be between 40 and 600 lb — or leave it blank."); return; }
          editedWeight = Math.round(editedWeight*10)/10;
        }
        var ageV = parseInt(document.getElementById("pfAgeEdit").value, 10);
        state.profile.age = (!isNaN(ageV) && ageV>=5 && ageV<=100) ? ageV : null;
        state.profile.heightIn = ht.heightIn;
        var picked = readChipValues(document.getElementById("editGoalChips"), "data-goalchip");
        state.profile.goals = picked;
        state.profile.goal = picked.length ? picked[0] : null; // legacy field kept in sync
        var goalCustom = document.getElementById("pfGoalCustom");
        if(goalCustom) state.profile.goalCustom = goalCustom.value.trim() || null;
        state.sports = readChipValues(document.getElementById("editSportChips"), "data-sportchip");
        state.profile.positions = readChipValues(document.getElementById("editPositionChips"), "data-positionchip");
        if(editedWeight!==null){
          var today = todayKey();
          var todayIndex = -1;
          state.weights.forEach(function(entry, idx){ if(entry.date===today) todayIndex = idx; });
          if(todayIndex>=0) state.weights[todayIndex].lbs = editedWeight;
          else state.weights.push({ date:today, lbs:editedWeight });
        }
        var calSel = document.getElementById("pfCalEdit");
        if(calSel) state.profile.showCalories = calSel.value !== "off";
        save(); toast("Saved."); renderAll();
      });
      document.getElementById("icsBtn").addEventListener("click", downloadICS);
      document.getElementById("dlSw").addEventListener("click", function(){ downloadText("sw.js", SW_CODE, "text/javascript"); });
      document.getElementById("dlManifest").addEventListener("click", function(){ downloadText("manifest.json", MANIFEST_CODE, "application/json"); });
      document.getElementById("lockBtn").addEventListener("click", function(){
        unlocked = false; pinEntry = "";
        window.scrollTo(0,0); renderGate();
      });
      document.getElementById("wipeBtn").addEventListener("click", function(){
        if(this.getAttribute("data-arm")==="1"){
          localStorage.removeItem(LS_KEY);
          state = blankState(); unlocked = false; pinEntry = "";
          window.scrollTo(0,0); renderGate();
        } else {
          this.setAttribute("data-arm","1"); this.textContent = "Tap again to confirm erase";
          setTimeout(function(){ var b=document.getElementById("wipeBtn"); if(b){ b.removeAttribute("data-arm"); b.textContent="Erase everything"; } }, 3500);
        }
      });
    }
    function downloadText(name, text, type){
      var blob = new Blob([text], { type:type });
      var a = document.createElement("a");
      a.href = URL.createObjectURL(blob); a.download = name;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function(){ URL.revokeObjectURL(a.href); }, 2000);
    }
    function downloadICS(){
      function stamp(daysFromNow, hour){
        var d = new Date(); d.setDate(d.getDate()+daysFromNow); d.setHours(hour,0,0,0);
        return d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+"T"+pad(d.getHours())+"0000";
      }
      // first workout day on/after today, from the user's own schedule
      var sch = effectiveSchedule();
      var codes = { 0:"SU", 1:"MO", 2:"TU", 3:"WE", 4:"TH", 5:"FR", 6:"SA" };
      var byday = DAY_ORDER.filter(function(dn){ return sch[dn]; }).map(function(dn){ return codes[dn]; }).join(",") || "MO,WE,TH";
      var toFirst = 0; var probe = new Date();
      while(!sch[probe.getDay()] && toFirst<7){ probe = addDays(probe,1); toFirst++; }
      var ics = ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Gym Tracker//EN",
        "BEGIN:VEVENT","UID:gymtracker-"+Date.now()+"@local","DTSTAMP:"+stamp(0,9),
        "DTSTART:"+stamp(toFirst,16),"DTEND:"+stamp(toFirst,17),
        "RRULE:FREQ=WEEKLY;BYDAY="+byday,
        "SUMMARY:Gym Tracker — today's quest is waiting",
        "DESCRIPTION:Open Gym Tracker and check off today's session — quests follow the workout days you picked in My Schedule.",
        "BEGIN:VALARM","TRIGGER:PT0M","ACTION:DISPLAY","DESCRIPTION:Gym quest time","END:VALARM",
        "END:VEVENT","END:VCALENDAR"].join("\r\n");
      downloadText("gym-tracker-reminders.ics", ics, "text/calendar");
      toast("Reminder file downloaded — open it to add to your calendar.");
    }

    /* ---------------- tabs / render ---------------- */
    var TAB_DEFS = [
      { id:"quest",    label:"Quest",    icon:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M13 2 4.5 13.5H11L9.5 22 19 10h-6.5L13 2z"/></svg>' },
      { id:"progress", label:"Progress", icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 19V11M9.5 19V5M15 19v-7M20 19H3"/></svg>' },
      { id:"coach",    label:"Coach",    icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 4H21l-1.4 3.6h-5.1zM14.5 7.6a6.8 6.8 0 1 0 3.4 6"/><circle cx="10.7" cy="14.6" r="1.5" fill="currentColor" stroke="none"/></svg>' },
      { id:"more",     label:"More",     icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3.5" y="3.5" width="7" height="7" rx="1.6"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.6"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.6"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.6"/></svg>' }
    ];
    function initTabs(){
      document.querySelectorAll(".tab").forEach(function(btn, i){
        var def = TAB_DEFS[i];
        btn.innerHTML = def.icon + "<span>"+def.label+"</span>";
        btn.addEventListener("click", function(){
          activeTab = def.id;
          document.querySelectorAll(".tab").forEach(function(b){ b.classList.toggle("on", b.getAttribute("data-tab")===activeTab); });
          ["quest","progress","coach","more"].forEach(function(t){
            document.getElementById("view-"+t).classList.toggle("hidden", t!==activeTab);
          });
          window.scrollTo(0,0);
          renderAll();
        });
      });
    }
    function renderAll(){
      if(!state.profile) return;
      renderHUD(); renderQuest(); renderProgress(); renderCoach(); renderMore();
    }

    /* ---------------- service worker (works when hosted with sw.js alongside) ---------------- */
    if("serviceWorker" in navigator && window.self===window.top){
      window.addEventListener("load", function(){
        navigator.serviceWorker.register("sw.js").catch(function(){ /* not hosted with sw.js yet — fine */ });
      });
    }

    /* ---------------- init ---------------- */
    initTabs();
    renderGate();
    </script>
  </body>
</html>
